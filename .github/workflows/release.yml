name: Build a verified draft release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag, e.g. v2.0.4
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  test:
    uses: ./.github/workflows/ci.yml
    with:
      ref: ${{ inputs.tag || github.ref_name }}
    permissions:
      contents: read

  draft:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
      PYTHONUTF8: '1'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          ref: ${{ inputs.tag || github.ref_name }}
          persist-credentials: false
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: '3.13'
      - name: Build tooling
        run: python -m pip install --upgrade setuptools wheel
      - name: Enforce tag/source version match and build
        run: python scripts/build_release.py --output-dir dist --tag "$RELEASE_TAG" --wheel
      - name: Verify publication boundary and artifact hashes
        run: python scripts/check_release_content.py --dist dist --require-wheel
      - name: Create draft with verified assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$RELEASE_TAG" dist/* --verify-tag --draft --title "Lite Recommender $RELEASE_TAG" --generate-notes
      # The maintainer reviews the draft and test matrix, then publishes it.
      # No personal token, source API key, or automatic public publication.
